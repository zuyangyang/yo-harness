# Sandbox: Docker-in-Docker for tool execution isolation
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      NODE_ENV: production
      YO_PORT: "3456"
      YO_JWT_SECRET: ${YO_JWT_SECRET:-change-me-in-production}
      YO_STORAGE: postgres
      YO_PG_HOST: db
      YO_PG_PORT: "5432"
      YO_PG_DATABASE: yo_harness
      YO_PG_USER: yo
      YO_PG_PASSWORD: ${YO_PG_PASSWORD:-yo_harness_pw}
      YO_SANDBOX_MODE: docker
      YO_DOCKER_NETWORK: yo-harness_sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3456:3456"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - server
    ports:
      - "8080:80"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yo_harness
      POSTGRES_USER: yo
      POSTGRES_PASSWORD: ${YO_PG_PASSWORD:-yo_harness_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yo -d yo_harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  sandbox:
    build:
      context: ..
      dockerfile: docker/sandbox/Dockerfile.sandbox
    # This image is used as a template for dynamic containers;
    # it is not started directly by compose.
    profiles: ["template"]

volumes:
  pgdata:
