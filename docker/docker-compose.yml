# Production: server + web + PostgreSQL
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yo_harness
      POSTGRES_USER: yo
      POSTGRES_PASSWORD: ${YO_PG_PASSWORD:-yo_harness_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yo -d yo_harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      YO_PORT: "3456"
      YO_JWT_SECRET: ${YO_JWT_SECRET:-change-me-in-production}
      YO_STORAGE: postgres
      YO_PG_HOST: db
      YO_PG_PORT: "5432"
      YO_PG_DATABASE: yo_harness
      YO_PG_USER: yo
      YO_PG_PASSWORD: ${YO_PG_PASSWORD:-yo_harness_pw}
      YO_PROVIDER: ${YO_PROVIDER:-fake}
      YO_MODEL: ${YO_MODEL:-fake}
      YO_API_KEY: ${YO_API_KEY:-}
      YO_BASE_URL: ${YO_BASE_URL:-}
    ports:
      - "3456:3456"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
